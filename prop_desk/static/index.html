<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop Desk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/floor.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">◆</span> PROP DESK <span class="badge paper">PAPER</span></div>
  <div class="badges"><span id="mode" class="badge">…</span><span id="datasrc" class="badge">data: …</span></div>
  <div class="stats">
    <div><label>Equity</label><b id="equity">–</b></div>
    <div><label>Day P&amp;L</label><b id="daypnl">–</b></div>
    <div><label>Total P&amp;L</label><b id="totpnl">–</b></div>
    <div><label>AI cost</label><b id="cost">$0.00</b></div>
  </div>
  <form class="controls" id="runform">
    <input id="symbols" placeholder="Tickers (optional) e.g. NVDA, XOM" autocomplete="off">
    <button id="runbtn" type="submit">Run session</button>
    <button id="resetbtn" type="button" class="ghost" title="Reset paper account">Reset</button>
  </form>
</header>

<nav class="pipeline" id="pipeline">
  <div data-p="research">Research</div><div data-p="pitch">Pitch</div><div data-p="round1">Round 1 · blind vote</div>
  <div data-p="debate">Debate</div><div data-p="vote">Consensus</div><div data-p="risk">Risk</div><div data-p="execute">Execute</div>
</nav>

<main class="grid">
  <section class="panel floor-panel">
    <h2>The Floor</h2>
    <div class="floor" id="floor">
      <div class="table" id="table">
        <div class="t-empty" id="tEmpty">Press <b>Run session</b> to open the floor.</div>
        <div class="t-body hidden" id="tBody">
          <div class="t-head"><span id="tSym">—</span><span id="tPx"></span><span id="tScreen" class="muted"></span></div>
          <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
          <div class="gauge">
            <div class="g-track"><div class="g-band" id="gBand"></div><div class="g-ghost" id="gGhost"></div><div class="g-needle" id="gNeedle"></div></div>
            <div class="g-scale"><span>SHORT</span><span id="gScore">score —</span><span>LONG</span></div>
          </div>
          <div class="t-verdict" id="tVerdict"></div>
        </div>
      </div>
      <!-- agent seats are injected here -->
    </div>
  </section>

  <section class="panel chat-panel">
    <h2>Desk Chat <span class="muted" id="chatCount"></span></h2>
    <div class="chat" id="chat"></div>
  </section>

  <section class="panel votes-panel">
    <h2>Vote Board <span class="muted" id="voteSym"></span></h2>
    <table class="votes" id="votes">
      <thead><tr><th>Trader</th><th>Round 1</th><th>Round 2</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="muted small" id="rules"></p>
  </section>

  <section class="panel book-panel">
    <h2>Book</h2>
    <table class="book" id="positions">
      <thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Last</th><th>Stop</th><th>Target</th><th>P&amp;L</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Blotter</h3>
    <div class="blotter" id="blotter"></div>
  </section>
</main>

<script src="/static/floor.js"></script>
</body>
</html>
